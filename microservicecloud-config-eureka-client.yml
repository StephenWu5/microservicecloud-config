spring:
  profiles:
    active:
      - dev

---

# ============ 开发环境：Eureka Server 7001（集群节点1） ============
server:
  port: 7001

spring:
  profiles: dev
  application:
    name: microservicecloud-config-eureka-client

eureka:
  server:
    enable-self-preservation: false                          # 关闭自我保护机制（开发环境）
  instance:
    hostname: eureka7001.com                                # eureka服务端名称
  client:
    register-with-eureka: false                             # false表示不向注册中心注册自己
    fetch-registry: false                                   # false表示自己就是注册中心，职责是维护服务实例，不需要去检索服务
    service-url:
      # 单机：defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
      defaultZone: http://eureka7002.com:7002/eureka/,http://eureka7003.com:7003/eureka/   # 集群：指向另外两个节点

---

# ============ 测试环境：Eureka Server 7002（集群节点2） ============
server:
  port: 7002

spring:
  profiles: test
  application:
    name: microservicecloud-config-eureka-client

eureka:
  server:
    enable-self-preservation: false
  instance:
    hostname: eureka7002.com
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      # 单机：defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
      defaultZone: http://eureka7001.com:7001/eureka/,http://eureka7003.com:7003/eureka/
