spring:
  profiles:
    active:
      - dev

---

# ============ 开发环境：dept 提供者 8001（对应 cloudDB01） ============
server:
  port: 8001

mybatis:
  config-location: classpath:mybatis/mybatis.cfg.xml        # mybatis配置文件所在路径
  type-aliases-package: com.atguigu.springcloud.entities    # 所有Entity别名类所在包
  mapper-locations:
    - classpath:mybatis/mapper/**/*.xml                     # mapper映射文件

spring:
  profiles: dev
  application:
    name: microservicecloud-config-dept-client
  cloud:
    inetutils:
      ignored-interfaces:
        - docker0    # 排除 docker 虚拟网卡（DOWN 状态），避免 Eureka 选到不可达的 172.17.0.1
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource            # 当前数据源操作类型
    driver-class-name: com.mysql.jdbc.Driver                # mysql驱动包（配合 mysql-connector-java 5.1.49）
    url: jdbc:mysql://localhost:3307/cloudDB01?useUnicode=true&characterEncoding=utf8&useSSL=false  # 数据库名称
    username: root
    password: root
    dbcp2:
      min-idle: 5                                           # 数据库连接池的最小维持连接数
      initial-size: 5                                       # 初始化连接数
      max-total: 5                                          # 最大连接数
      max-wait-millis: 200                                  # 等待连接获取的最大超时时间

eureka:
  client:  # 客户端注册进eureka服务列表内
    service-url:
      defaultZone: http://eureka7001.com:7001/eureka/,http://eureka7002.com:7002/eureka/,http://eureka7003.com:7003/eureka/
  instance:
    hostname: localhost
    instance-id: microservicecloud-config-dept8001           # 自定义服务名称信息（每个实例必须唯一）
    prefer-ip-address: true                                 # 访问路径可以显示ip地址

info:
  app.name: atguigu-microservicecloud-config
  company.name: www.atguigu.com
  build.artifactId: microservicecloud-config-dept-client
  build.version: 0.0.1-SNAPSHOT

